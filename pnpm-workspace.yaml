packages:
  - apps/*
  - packages/*

# Fail the install when a package's "engines" field does not match (Node 24, see ADR-018).
engineStrict: true

# Dependency install scripts are denied unless listed here as true (pnpm 11 default).
allowBuilds:
  # Transitive dependency of eslint-config-next. Its postinstall only downloads a fallback binary;
  # the prebuilt binary comes from an optional dependency, so the script is not needed.
  unrs-resolver: false
  # Its postinstall only checks the binary that the platform-specific optional dependency already provides.
  esbuild: false
