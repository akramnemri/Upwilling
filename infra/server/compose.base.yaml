# Service definitions shared by compose.production.yaml and compose.recette.yaml (Task 1.4).
# Not a project of its own: each stack `extends` these, so both environments run the same settings and differ
# only in what the stack file sets (environment, memory limits, network aliases).
# 01_ARCHITECTURE.md §5.1, §10 (restart policy, healthcheck, memory limit and log rotation on every container).
services:
  app:
    # Set by the deploy workflow (Task 1.5): the registry image tagged with the commit SHA.
    image: ${APP_IMAGE:?set APP_IMAGE in .env}
    # A real init process as PID 1: it forwards SIGTERM to Node and reaps zombie processes.
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # The image has its own HEALTHCHECK (liveness, /api/health or the worker heartbeat).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    # Major 18 (ADR-005, PostgreSQL confirmed by the supervisor 2026-10-20). Multi-arch digest (amd64 + arm64).
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    # The image's postgres user (uid 999) owns the data volume; starting as it directly needs no capabilities.
    user: "999:999"
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Since 18 the image's volume is /var/lib/postgresql (data in /var/lib/postgresql/18/docker), so a later
    # major upgrade can sit next to the old data.
    volumes:
      - postgres-data:/var/lib/postgresql
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 128m
    # Lets Postgres finish its shutdown checkpoint instead of being killed after Docker's default 10 s.
    stop_grace_period: 60s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Never published: reachable only on the stack's own network.
