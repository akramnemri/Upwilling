# Encrypted database backups and restores (Task 1.6a, ADR-026). Compose project `upwilling-backup`, apart from the
# stacks: the deploy agent's `up --remove-orphans` never touches it, and a failing backup cannot block a deploy.
#
# On the server folder (C:\upwilling-server on the local machine, /srv later):
#   backup/compose.backup.yaml + backup/backup/   (copies of the repository files)
#   backup/.env                                   (from .env.backup.example, created by a human)
#   <stack>/.env                                  (already there: the database password is read from it)
#   cd backup && docker compose -f compose.backup.yaml up -d --build
# Runbook: docs/runbooks/backup-restore.md. Test: infra/server/test/smoke-backup.sh
name: upwilling-backup

x-container: &container
  image: ${BACKUP_IMAGE:-upwilling-backup:local}
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  mem_limit: 256m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  backup:
    <<: *container
    build: ./backup
    env_file:
      - ../${BACKUP_STACK:?set BACKUP_STACK in .env}/.env
      - .env
    volumes:
      # A folder on the host, not a Docker volume: resetting Docker must not take the backups with the database.
      - ${BACKUP_LOCAL_DIR:-../backups}:/backups
    restart: unless-stopped
    # Unhealthy when no round has succeeded for an hour (a round retries every BACKUP_POLL_SECONDS).
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 3600"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 1h
      start_interval: 5s
    networks:
      - source

  # One-off, never started by `up`:
  #   docker compose -f compose.backup.yaml run --rm -v <private key file>:/run/secrets/age-identity:ro \
  #     restore check <backup>
  restore:
    <<: *container
    profiles: [restore]
    entrypoint: ["bash", "/usr/local/lib/upwilling-backup/restore.sh"]
    env_file:
      # Always recette's password, whichever stack the backups come from.
      - ../recette/.env
      - .env
    volumes:
      - ${BACKUP_LOCAL_DIR:-../backups}:/backups:ro
    networks:
      - recette

networks:
  source:
    name: ${BACKUP_NETWORK:?set BACKUP_NETWORK in .env}
    external: true
  recette:
    # Only the smoke test overrides the name. restore.sh checks the server itself either way.
    name: ${RESTORE_NETWORK:-upwilling-recette_default}
    external: true
