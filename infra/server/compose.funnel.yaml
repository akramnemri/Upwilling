# Public access to recette during the test phase (Task 1.5c, ADR-025), while the domain and server are not ready:
# three Tailscale devices publish https://<name>.<tailnet>.ts.net through Tailscale Funnel and forward to a local
# Caddy (`ingress`, caddy/Caddyfile.funnel), which adds basic auth and headers and hands the request to recette.
# Nothing here publishes a port: Funnel connections are outbound from these containers.
#
# On the server folder (C:\upwilling-server\funnel on the local machine), copies of the repository files:
#   compose.funnel.yaml, caddy/Caddyfile.funnel, tailscale/serve-*.json, and a .env (infra/server/.env.funnel.example)
#   docker compose -f compose.funnel.yaml up -d
# Runbook: docs/runbooks/local-server.md (Public access). Test: infra/server/test/smoke-funnel.sh (ingress only)
name: upwilling-funnel

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# One Tailscale device per public name. Userspace networking (the image's default): no extra capability, no
# /dev/net/tun. The device identity lives in a volume, so the auth key is only used on the first start.
x-tailscale: &tailscale
  image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d # multi-arch digest
  read_only: true
  tmpfs:
    - /tmp
    - /var/run/tailscale
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  mem_limit: 128m
  logging: *logging
  networks:
    - default
    - internal

x-tailscale-env: &tailscale-env
  # Reusable, tagged, not ephemeral (runbook). Only needed until each device has joined: then it can be removed
  # from .env and revoked in the Tailscale console.
  TS_AUTHKEY: ${TS_AUTHKEY:-}
  TS_AUTH_ONCE: "true"
  TS_EXTRA_ARGS: --advertise-tags=tag:upwilling-recette
  TS_STATE_DIR: /var/lib/tailscale
  TS_ENABLE_HEALTH_CHECK: "true"
  TS_LOCAL_ADDR_PORT: 127.0.0.1:9002

services:
  ingress:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.funnel", "--adapter", "caddyfile"]
    # No file here is secret, so Caddy runs as `nobody`.
    user: "65534:65534"
    environment:
      RECETTE_BASIC_AUTH_USER: ${RECETTE_BASIC_AUTH_USER:?set RECETTE_BASIC_AUTH_USER in .env}
      RECETTE_BASIC_AUTH_HASH: ${RECETTE_BASIC_AUTH_HASH:?set RECETTE_BASIC_AUTH_HASH in .env}
    volumes:
      - ./caddy:/etc/caddy:ro
    read_only: true
    tmpfs:
      - /data:uid=65534,gid=65534
      - /config:uid=65534,gid=65534
    cap_drop:
      - ALL
    # The image marks the caddy binary with this file capability: without it the binary does not start (ADR-023).
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    logging: *logging
    # Internal networks only: reachable from the Tailscale devices, reaches recette, nothing else.
    networks:
      - internal
      - recette

  tailscale-academy:
    <<: *tailscale
    environment:
      <<: *tailscale-env
      TS_HOSTNAME: upwilling-recette
      TS_SERVE_CONFIG: /config/serve-academy.json
    volumes:
      - tailscale-academy:/var/lib/tailscale
      # A folder, not the file: Tailscale watches it and applies changes.
      - ./tailscale:/config:ro

  tailscale-careerboost:
    <<: *tailscale
    environment:
      <<: *tailscale-env
      TS_HOSTNAME: careerboost-recette
      TS_SERVE_CONFIG: /config/serve-careerboost.json
    volumes:
      - tailscale-careerboost:/var/lib/tailscale
      - ./tailscale:/config:ro

  tailscale-admin:
    <<: *tailscale
    environment:
      <<: *tailscale-env
      TS_HOSTNAME: admin-recette
      TS_SERVE_CONFIG: /config/serve-admin.json
    volumes:
      - tailscale-admin:/var/lib/tailscale
      - ./tailscale:/config:ro

networks:
  # The Tailscale devices' way out to Tailscale's servers.
  default: {}
  # Tailscale devices <-> ingress.
  internal:
    internal: true
  # Ingress <-> the recette web and cms containers (created beforehand, see compose.edge.yaml).
  recette:
    name: ${EDGE_NETWORK_RECETTE:-upwilling-edge-recette}
    external: true

volumes:
  tailscale-academy: {}
  tailscale-careerboost: {}
  tailscale-admin: {}
