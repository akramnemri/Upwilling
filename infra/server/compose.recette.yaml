# Recette stack (Task 1.4; ADR-017, ADR-022; 01_ARCHITECTURE.md §5.1, §16). Compose project `upwilling-recette`:
# same services as production, its own network, database, volume and .env, about 60 % of production's memory.
# On the server: /srv/upwilling-recette (this file, compose.base.yaml, .env). The edge network must exist first
# (see compose.edge.yaml). Deployed by the deploy agent (Task 1.5b). Runbook: docs/runbooks/compose-stacks.md
#   docker compose -f compose.recette.yaml up -d --wait
# Nothing here publishes a port: Caddy (compose.edge.yaml) is the only way in, with basic auth.
name: upwilling-recette

services:
  web-upwilling:
    extends: { file: compose.base.yaml, service: app }
    environment:
      DEPLOY_ENV: recette
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ROLE: web
      SITE: upwilling
    mem_limit: 320m
    networks:
      default: {}
      edge:
        aliases: [recette-web-upwilling]

  web-careerboost:
    extends: { file: compose.base.yaml, service: app }
    environment:
      DEPLOY_ENV: recette
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ROLE: web
      SITE: careerboost
    mem_limit: 320m
    networks:
      default: {}
      edge:
        aliases: [recette-web-careerboost]

  cms:
    extends: { file: compose.base.yaml, service: app }
    environment:
      DEPLOY_ENV: recette
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ROLE: cms
      # Payload (Task 3.1b): role `app` (db-setup), never the superuser; no password in the URL.
      DATABASE_URL: postgres://app@postgres:5432/app
      PGPASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      # Uploads stay on the media volume until R2 exists (ADR-008 exception for recette, Task 3.1b).
      MEDIA_DIR: /data/media
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/data/media
    mem_limit: 320m
    networks:
      default: {}
      edge:
        aliases: [recette-cms]

  # One-off containers, started by the deploy agent only (`docker compose run --rm <name>`), in this order:
  # db-setup (role `app`), the pre-migration backup, migrate, then `up` switches the release (ADR-024).
  db-setup:
    extends: { file: compose.base.yaml, service: db-setup }
    profiles: [deploy-steps]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default: {}

  migrate:
    extends: { file: compose.base.yaml, service: app }
    profiles: [deploy-steps]
    restart: "no"
    environment:
      DEPLOY_ENV: recette
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ROLE: migrate
      # Payload (Task 3.1b): role `app` (db-setup), never the superuser; no password in the URL.
      DATABASE_URL: postgres://app@postgres:5432/app
      PGPASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    # Runs to completion: no liveness to check.
    healthcheck:
      disable: true
    mem_limit: 384m
    networks:
      default: {}

  worker:
    extends: { file: compose.base.yaml, service: app }
    environment:
      DEPLOY_ENV: recette
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ROLE: worker
    mem_limit: 256m
    # Serves no HTTP: not on the edge network.
    networks:
      default: {}

  # Database `app` for Payload (Task 3.1); `umami` is added with Task 5.8. Synthetic data only.
  postgres:
    extends: { file: compose.base.yaml, service: postgres }
    # The name backup/restore.sh asks this server for: restores only go into a server that says `recette`.
    command: ["postgres", "-c", "cluster_name=recette"]
    mem_limit: 640m
    networks:
      default: {}

networks:
  # The stack's own network: app <-> postgres, and outbound calls (Stripe test mode, Brevo...).
  default: {}
  edge:
    # Created beforehand (see compose.edge.yaml). Only the smoke tests override the name.
    name: ${EDGE_NETWORK_RECETTE:-upwilling-edge-recette}
    external: true

volumes:
  postgres-data: {}
  # Uploaded media (synthetic only) until R2 exists. Not backed up: recette data is disposable.
  media: {}
