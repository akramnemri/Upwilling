# Production stack (Task 1.4; 01_ARCHITECTURE.md §5.1, §16). Compose project `upwilling-prod`.
# On the server: /srv/upwilling-prod (this file, compose.base.yaml, .env). The edge network must exist first
# (see compose.edge.yaml). Deployed by the deploy agent (Task 1.5b). Runbook: docs/runbooks/compose-stacks.md
#   docker compose -f compose.production.yaml up -d --wait
# Nothing here publishes a port: Caddy (compose.edge.yaml) is the only way in.
name: upwilling-prod

services:
  web-upwilling:
    extends: { file: compose.base.yaml, service: app }
    environment:
      DEPLOY_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ROLE: web
      SITE: upwilling
    mem_limit: 512m
    networks:
      default: {}
      edge:
        aliases: [prod-web-upwilling]

  web-careerboost:
    extends: { file: compose.base.yaml, service: app }
    environment:
      DEPLOY_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ROLE: web
      SITE: careerboost
    mem_limit: 512m
    networks:
      default: {}
      edge:
        aliases: [prod-web-careerboost]

  cms:
    extends: { file: compose.base.yaml, service: app }
    environment:
      DEPLOY_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ROLE: cms
      # Payload (Task 3.1b): role `app` (db-setup), never the superuser; no password in the URL.
      DATABASE_URL: postgres://app@postgres:5432/app
      PGPASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      # Media on R2 only (ADR-008): the cms refuses to start without these four.
      R2_ENDPOINT: ${R2_ENDPOINT:?set R2_ENDPOINT in .env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID in .env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY in .env}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:?set R2_PUBLIC_BUCKET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    networks:
      default: {}
      edge:
        aliases: [prod-cms]

  # One-off containers, started by the deploy agent only (`docker compose run --rm <name>`), in this order:
  # db-setup (role `app`), the pre-migration backup, migrate, then `up` switches the release (ADR-024).
  db-setup:
    extends: { file: compose.base.yaml, service: db-setup }
    profiles: [deploy-steps]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default: {}

  migrate:
    extends: { file: compose.base.yaml, service: app }
    profiles: [deploy-steps]
    restart: "no"
    environment:
      DEPLOY_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ROLE: migrate
      # Payload (Task 3.1b): role `app` (db-setup), never the superuser; no password in the URL.
      DATABASE_URL: postgres://app@postgres:5432/app
      PGPASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    # Runs to completion: no liveness to check.
    healthcheck:
      disable: true
    mem_limit: 384m
    networks:
      default: {}

  worker:
    extends: { file: compose.base.yaml, service: app }
    environment:
      DEPLOY_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ROLE: worker
    mem_limit: 384m
    # Serves no HTTP: not on the edge network.
    networks:
      default: {}

  # Database `app` for Payload (Task 3.1); `umami` is added with Task 5.8.
  postgres:
    extends: { file: compose.base.yaml, service: postgres }
    # Not `recette`: backup/restore.sh refuses this server.
    command: ["postgres", "-c", "cluster_name=production"]
    mem_limit: 1g
    networks:
      default: {}

networks:
  # The stack's own network: app <-> postgres, and outbound calls (Stripe, Brevo, R2...).
  default: {}
  edge:
    # Created beforehand (see compose.edge.yaml). Only the smoke tests override the name.
    name: ${EDGE_NETWORK_PROD:-upwilling-edge-prod}
    external: true

volumes:
  postgres-data: {}
